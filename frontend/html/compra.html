<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra</title>
    <link rel="stylesheet" href="/frontend/css/compra.css">
</head>

<body>
    <main-navbar></main-navbar>
    <script src="/components/navbar.js"></script>

    <main style="flex: 1;" class="container d-flex justify-content-center align-items-center contenedor-pago-central" style="min-height: 80vh;">
        <div class="pago-card">
            <h2 class="text-center mb-4">Información de Pago</h2>
            
            <form id="form-finalizar-compra">
                <div class="mb-3">
                    <label for="metodoPago" class="form-label">Selecciona tu método de pago</label>
                    <select class="form-select custom-input" id="metodoPago" required>
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="nequi">Nequi / Daviplata</option>
                        <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                        <option value="PSE">PSE / Transferencia</option>
                    </select>
                </div><br>

                

                <button type="submit" class="btn-comprar-final">Confirmar Compra</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="carrito.html" class="link-volver">← Volver al carrito</a>
            </div>
        </div>
    </main>

    <main-footer></main-footer>
    <script src="/components/footer.js"></script>
    <!--Para que aparezcan los iconos de las redes sociales en el footer-->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Controlador de la compra -->
    <script type="module" src="/frontend/js/MVC/compra/compraController.js"></script>
</body>

</html>
