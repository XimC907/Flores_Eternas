<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Flores Eternas</title>
    <link rel="stylesheet" href="/frontend/css/contacto.css">
    <link rel="shortcut icon" href="/frontend/imagenes/nicorelogo.png" type="image/x-icon">
</head>

<body>

    <main-navbar></main-navbar>
    <script src="/components/navbar.js"></script>
    <script src="/frontend/js/MVC/tipos-flores/tipos-flores.js"></script>


    <div class="formulario">

        <h2>Formulario de Contacto</h2>

        <form id="formulario">

            <!-- Nombre -->
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre y apellido" required>
            </div>

            <!-- Fecha de entrega -->
            <div class="campo">
                <label for="fecha">Fecha de entrega</label>
                <input type="date" id="fecha" required>
            </div>

            <!-- Dirección de entrega -->
            <div class="campo">
                <label for="direccion">Dirección de entrega</label>
                <input type="text" id="direccion" placeholder="Ejemplo: Calle principal #23" required>
            </div>
            
            <!-- Hora de entrega -->
            <div class="campo">
                <label for="hora">Hora de entrega</label>
                <select name="hora" id="hora" required>
                    <option value="">Seleccione una hora</option>
                </select>
            </div>

            <!-- Tamaño del ramo -->
            <div class="campo">
                <label for="tamano">Tamaño del ramo</label>
                <select name="tamano" id="tamano" required>
                    <option value="">Seleccione un tamaño</option>
                    <option value="pequeño">Pequeño</option>
                    <option value="mediano">Mediano</option>
                    <option value="grande">Grande</option>
                </select>
            </div>

            <!-- Ocasión -->
            <div class="campo">
                <label for="ocasion">Ocasión</label>
                <select name="ocasion" id="ocasion" required>
                    <option value="">Seleccione una ocasión</option>
                    <option value="cumpleaños">Cumpleaños</option>
                    <option value="aniversario">Aniversario</option>
                    <option value="amor y amistad">Amor y amistad</option>
                    <option value="graduacion">Graduación</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <!-- Complemento -->
            <div class="campo">

                <label>Complementos</label>

                <details class="select-multiple" id="complemento">

                <summary>
                    Selecciona complementos
                </summary>

                <label>
                    <input type="checkbox" name="complemento" value="Dulces y Chocolates">
                        Dulces y Chocolates
                </label>

                <label>
                    <input type="checkbox" name="complemento" value="Peluches">
                        Peluches
                </label>

                <label>
                    <input type="checkbox" name="complemento" value="Globos">
                        Globos
                </label>

                <label>
                    <input type="checkbox" name="complemento" value="Joyería o Perfumes">
                        Joyería o Perfumes
                </label>

                <label>
                    <input type="checkbox" name="complemento" value="Bebidas">
                        Bebidas
                </label>

                <label>
                    <input type="checkbox" name="complemento" value="Sobres y Tarjetas">
                        Sobres y Tarjetas
                </label>

                </details>

            </div>

            <!-- Mensaje -->
            <div class="campo">
                <label for="mensaje">¿Qué más deseas agregar?</label>
                <textarea id="mensaje" placeholder="Describe lo que desees añadir" rows="4" required></textarea>
            </div>

            <button type="submit">Enviar</button>

        </form>
    </div>

    <script src="/frontend/js/MVC/contacto/contacto.js"></script>

    <main-footer></main-footer>
    <script src="/components/footer.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
