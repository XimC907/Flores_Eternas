<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Flores Eternas</title>
    <link rel="stylesheet" href="/frontend/css/contacto.css">
    <link rel="shortcut icon" href="/frontend/imagenes/logoNicore.png" type="image/x-icon">
</head>

<body>

    <main-navbar></main-navbar>
    <script src="/components/navbar.js"></script>
    <script src="/frontend/js/MVC/tipos-flores/tipos-flores.js"></script>


    <div class="formulario">

        <h2>Formulario de Contacto</h2>

        <form id="miFormulario">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre y apellido">
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" placeholder="Escribe tu correo">
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" placeholder="Escribe tu mensaje"></textarea>
            </div>

            <button type="submit">Enviar</button>

        </form>
    </div>

    <script src="/frontend/js/MVC/contacto/contacto.js"></script>

    <main-footer></main-footer>
    <script src="/components/footer.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
