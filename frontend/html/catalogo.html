<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Flores Eternas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/catalogo.css">
    <link rel="shortcut icon" href="/frontend/imagenes/logoNicore.png" type="image/x-icon">
</head>

<body>

    <main-navbar></main-navbar>
    <script src="/components/navbar.js"></script>

    <div class="container my-5">
        <h4 class="mb-4">Explora Nuestro Catálogo Y Enamórate De Nuestros Productos</h4>

        <div id="filtro-container">
            <div class="filtro-contenido">
                <label for="filtroPrecio" class="form-label text-white">Filtrar por precio máximo:</label>
                <input type="range" class="form-range" min="10000" max="420000" step="5000" id="filtroPrecio"
                    value="150000">
                <div class="text-white text-center">Precio: <span id="valorPrecio">$150.000</span></div>
            </div>
        </div>

        <div class="row g-4 justify-content-center" id="contenedor-productos">

        </div>
    </div>
    
    <main-footer></main-footer>
    <script src="/components/footer.js"></script>
    <!--Para que aparezcan los iconos de las redes sociales en el footer-->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Controlador del catálogo -->
    <script type="module" src="/frontend/js/MVC/catalogo/catalogoController.js"></script>
</body>

</html>
